packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@eslint/js": ^10.0.1
  "@tailwindcss/postcss": ^4.1.16
  "@tailwindcss/vite": ^4.3.0
  "@tanstack/react-form": ^1.23.8
  "@tanstack/react-query": ^5.100.14
  "@trpc/client": ^11.7.1
  "@trpc/server": ^11.19.0
  "@trpc/tanstack-react-query": ^11.7.1
  "@types/node": ^25.9.1
  "@vitejs/plugin-react": 5.1.0
  auth: 1.7.14
  better-auth: 1.7.14
  eslint: ^10.4.0
  prettier: 3.8.3
  tailwindcss: ^4.3.0
  typescript: ^6.0.3
  zod: ^4.6.7
  vite: 8.1.6

catalogs:
  react19:
    "@types/react": ~19.1.0
    "@types/react-dom": ~19.1.0
    react: 19.1.4
    react-dom: 19.1.4

linkWorkspacePackages: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild

overrides:
  # ponytail: package.json pnpm.overrides used to shadow this block, so the old
  # vite/lightningcss pins here were never applied. Floors below clear pnpm audit.
  "@types/node": ^22.18.12
  vite: 8.1.6
  brace-expansion@<1.1.20: ^1.1.20
  brace-expansion@>=2 <2.1.6: ^2.1.6
  brace-expansion@>=5 <5.0.11: ^5.0.11
  browserslist: ^4.28.7
  defu: ^6.1.5
  devalue: ^5.9.3
  flatted: ^3.4.2
  js-yaml@<4: ^3.15.2
  minimatch@<4: ^3.1.4
  mysql2: ^3.23.1
  rollup: ^4.59.0
  source-map-js: ^1.2.2

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
