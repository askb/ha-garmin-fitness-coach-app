name: 'Release'

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  validate:
    name: 'Validate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: 'audit'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.4.0  # zizmor: ignore[cache-poisoning] caching disabled (no cache input)
        with:
          node-version: 22

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Typecheck'
        run: pnpm turbo typecheck

      - name: 'Engine tests'
        run: pnpm --filter @acme/engine test

      - name: 'Build'
        run: pnpm --filter @acme/nextjs build
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
          AUTH_SECRET: 'ci-secret'
          AUTH_DISCORD_ID: 'ci-placeholder'
          AUTH_DISCORD_SECRET: 'ci-placeholder'
          DEV_BYPASS_AUTH: 'true'

  sbom:
    name: 'Generate SBOM'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: 'audit'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.4.0  # zizmor: ignore[cache-poisoning] caching disabled (no cache input)
        with:
          node-version: 22

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Generate CycloneDX SBOM'
        run: |
          npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom-cyclonedx.json --output-format json
          npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom-cyclonedx.xml --output-format xml

      - name: 'Upload SBOM artifacts'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-files
          path: |
            sbom-cyclonedx.json
            sbom-cyclonedx.xml
          retention-days: 90

      - name: 'Security scan with Grype'
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        id: grype
        with:
          sbom: sbom-cyclonedx.json
          output-format: 'table'
          fail-build: 'false'
          config: '.grype.yaml'

  release:
    name: 'Create Release'
    runs-on: ubuntu-latest
    needs: [validate, sbom]
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: 'audit'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Download SBOM'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-files
          path: sbom/

      - name: 'Generate changelog'
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            {
              echo "changelog<<EOF"
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)"
              echo ""
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "changelog=Initial release" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Create GitHub Release'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          generate_release_notes: true
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}

            ## Security
            SBOM files are attached as build artifacts.
          files: |
            sbom/sbom-cyclonedx.json
            sbom/sbom-cyclonedx.xml
