name: 'Build & Test'

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  build-test:
    name: 'Build & Test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: 'audit'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Typecheck'
        run: pnpm turbo typecheck

      - name: 'Lint'
        continue-on-error: true
        run: pnpm turbo lint

      - name: 'Engine tests'
        run: pnpm --filter @acme/engine test

      - name: 'Build'
        run: pnpm --filter @acme/nextjs build
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
          AUTH_SECRET: 'ci-secret'
          AUTH_DISCORD_ID: 'ci-placeholder'
          AUTH_DISCORD_SECRET: 'ci-placeholder'
          DEV_BYPASS_AUTH: 'true'

  security-scan:
    name: 'Security Scan'
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: 'audit'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Generate SBOM'
        run: npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom.json --output-format json

      - name: 'Grype vulnerability scan'
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        with:
          sbom: sbom.json
          output-format: 'table'
          fail-build: 'false'
          config: '.grype.yaml'
